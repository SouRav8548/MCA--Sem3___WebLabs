<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* --- CSS VARIABLES & RESET --- */
      :root {
        --bg-main: #0a0e17; /* Very dark blue/black */
        --bg-card: #151b26; /* Slightly lighter card bg */
        --primary: #00d4ff; /* Neon Cyan */
        --secondary: #7986ac; /* Muted text */
        --white: #ffffff;
        --gradient: linear-gradient(135deg, #00d4ff 0%, #0055ff 100%);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Outfit", sans-serif;
        background-color: var(--bg-main);
        color: var(--white);
        display: flex;
        justify-content: center;
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        width: 100%;
        max-width: 1200px;
      }

      /* --- HEADER --- */
      header {
        margin-bottom: 50px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: end;
      }

      h1 {
        font-size: 2.5rem;
        letter-spacing: -1px;
      }

      h1 span {
        background: var(--gradient);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        color: var(--secondary);
        font-size: 0.9rem;
      }

      /* --- GRID LAYOUT --- */
      .project-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }

      /* --- CARD STYLES --- */
      .card {
        background-color: var(--bg-card);
        border-radius: 12px;
        padding: 25px;
        text-decoration: none;
        color: inherit;
        position: relative;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Hover Effect */
      .card:hover {
        transform: translateY(-7px);
        box-shadow: 0 10px 25px -5px rgba(0, 212, 255, 0.15);
        border-color: rgba(0, 212, 255, 0.3);
      }

      /* The glowing line on top of cards */
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: var(--gradient);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .card:hover::before {
        opacity: 1;
      }

      .icon-box {
        width: 50px;
        height: 50px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        font-size: 1.2rem;
        color: var(--primary);
      }

      .project-name {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .project-date {
        font-size: 0.8rem;
        color: var(--secondary);
        margin-top: auto; /* Pushes date to bottom */
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status {
        width: 6px;
        height: 6px;
        background-color: #00ff88; /* Green dot */
        border-radius: 50%;
      }

      /* Special style for the "Banking" highlight */
      .card.highlight .icon-box {
        background: rgba(0, 212, 255, 0.1);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1>Local <span>DevServer</span></h1>
          <p class="subtitle">Welcome back, Developer.</p>
        </div>
        <div class="subtitle">7 Projects Active</div>
      </header>

      <div class="project-grid">
        <a href="Banking_System/index.php" class="card highlight">
          <div class="icon-box">
            <i class="fa-solid fa-building-columns"></i>
          </div>
          <div class="project-name">Banking System</div>
          <div class="project-date">
            <span class="status"></span> Dec 20, 2025
          </div>
        </a>

        <a href="Bank/index.php" class="card">
          <div class="icon-box"><i class="fa-solid fa-wallet"></i></div>
          <div class="project-name">Banking Try</div>
          <div class="project-date">
            <span class="status"></span> Dec 16, 2025
          </div>
        </a>

        <a href="Project1/index.html" class="card">
          <div class="icon-box"><i class="fa-solid fa-code"></i></div>
          <div class="project-name">Project 1</div>
          <div class="project-date">
            <span class="status"></span> Dec 02, 2025
          </div>
        </a>

        <a href="Project2/public/login.php" class="card">
          <div class="icon-box"><i class="fa-solid fa-layer-group"></i></div>
          <div class="project-name">Project 2</div>
          <div class="project-date">
            <span class="status"></span> Dec 11, 2025
          </div>
        </a>

        <a href="Project3/index.php" class="card">
          <div class="icon-box"><i class="fa-solid fa-cubes"></i></div>
          <div class="project-name">Project 3</div>
          <div class="project-date">
            <span class="status"></span> Dec 08, 2025
          </div>
        </a>

        <a href="Project4/index.php" class="card">
          <div class="icon-box"><i class="fa-solid fa-flask"></i></div>
          <div class="project-name">Project 4</div>
          <div class="project-date">
            <span class="status"></span> Dec 17, 2025
          </div>
        </a>

        <a href="Projectxxxxxxxxxx/index.php" class="card">
          <div class="icon-box"><i class="fa-solid fa-folder-open"></i></div>
          <div class="project-name">Project X (Misc)</div>
          <div class="project-date">
            <span class="status"></span> Dec 11, 2025
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
